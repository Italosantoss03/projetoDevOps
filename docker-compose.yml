services:
  api:
    build: .
    container_name: api_contador
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: ${REDIS_HOST:-redis}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: banco_redis
    restart: unless-stopped
    # appendonly garante que os dados sejam gravados em disco (volume)
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - meus-dados:/data

volumes:
  meus-dados:
