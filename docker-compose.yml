version: '3.8'
services:
  api:
    build: .
    container_name: api_contador      # Bônus: Dá um nome limpo ao contêiner
    restart: unless-stopped           # Bônus: Reinicia sozinho se o PC reiniciar
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis              # Bônus: Injeta a configuração para o Python
    depends_on:
      - redis
  redis:
    image: "redis:alpine"
    container_name: banco_redis       # Bônus: Dá um nome limpo ao contêiner
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - meus-dados:/data

volumes:
  meus-dados: